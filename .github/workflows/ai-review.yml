name: ai-review

# Reusable workflow. Callers use:
#   uses: certible/.github/.github/workflows/ai-review.yml@main
#
# Reviews a PR against auto_review_base once when it is opened or marked
# ready for review. Add the "ai-review" label to any PR to request a review.

on:
  workflow_call:
    inputs:
      model:
        description: "Optional model override, e.g. claude-sonnet-5-5. Empty = Claude Code default."
        type: string
        required: false
        default: ""
      timeout_minutes:
        description: "Hard stop for the job."
        type: number
        required: false
        default: 20
      auto_review_base:
        description: "Base branch for automatic reviews. Empty = any base branch. The ai-review label works for any base branch."
        type: string
        required: false
        default: "staging"
      upload_transcript:
        description: "Upload Claude's full transcript (tool calls, permission denials, unfiltered review notes) as an artifact for debugging."
        type: boolean
        required: false
        default: true
    secrets:
      ORG_ANTHROPIC_API_KEY:
        description: "API key from the Console org linked to the Claude Team plan (uses the monthly API credits)."
        required: true

jobs:
  review:
    # Skip drafts and bot PRs. Run automatically only for PRs against
    # auto_review_base; run on any PR when the "ai-review" label is added.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'ai-review') ||
        (github.event.action != 'labeled' && (inputs.auto_review_base == '' || github.event.pull_request.base.ref == inputs.auto_review_base))
      )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    # One review per PR at a time; a new run cancels the in-flight run.
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    # Comments are posted with GITHUB_TOKEN (no Claude GitHub App needed),
    # so pull-requests needs write. It also allows removing the label.
    # The calling job must grant at least these permissions.
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      # Remove the label so it can be added again for the next re-review.
      - name: Remove ai-review label
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/ai-review"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Run review subagents in the foreground. Otherwise Claude can start
          # them in the background, end its turn, and the job stops before the
          # review is posted.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ORG_ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts findings on the PR (inline comments, or one summary
          # comment if nothing is found). Without it, output only goes to the run log.
          # Repos may use AGENTS.md instead of CLAUDE.md for their rules.
          # On a label re-review, the plugin must not stop because it already commented.
          # The plugin's "No issues found" comment hides what was not checked, so
          # the comment must list the unverified items and the notes below the threshold.
          # Compound commands and shell variables need approval, which CI cannot give.
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            In every step, where a directory has no CLAUDE.md but has an AGENTS.md, use that AGENTS.md as its CLAUDE.md, and cite and link the AGENTS.md.
            In the final PR comment, also when no issues are found, add a "Not verified" section that lists the checks that were not done, and a "Below the threshold" section that lists the notes the agents did not flag, with one short line each. Omit an empty section.
            Tell every agent: run one simple command per Bash call, with no pipes, no `;` or `&&`, and no shell variables, because other commands are denied.
            ${{ github.event.action == 'labeled' && 'Re-review requested with the ai-review label: ignore the "Claude has already commented on this PR" condition in step 1. Apply all other step 1 conditions.' || '' }}
          # Same tools as the plugin's allowed-tools frontmatter. Without them the
          # gh calls are denied and the review ends without a comment.
          # Read-only git commands let the agents read files at the PR head.
          # Do not allow node, python or Write: the PR content is untrusted, and
          # the job holds the API key and a write token.
          # The inline-comment MCP tool must be listed, otherwise the action
          # does not start the server that posts inline comments.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git show:*),Bash(git ls-tree:*),Bash(git log:*),Bash(git diff:*)"
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}

      # The action hides Claude's output in the log. Keep the full transcript
      # (tool calls, permission denials) as an artifact for debugging.
      # Public repos: the transcript also contains Claude's unfiltered review notes.
      - name: Upload Claude transcript
        if: always() && inputs.upload_transcript && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
